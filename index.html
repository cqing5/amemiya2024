<!DOCTYPE html>
<html>

<head>
  <title>motivated reasoning comparison experiment</title>
 <script src="https://unpkg.com/jspsych@8.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-select@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@2.0.0"></script>
  <!-- DataPipe extension, which saves our data -->
  <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
  <link href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css" rel="stylesheet" type="text/css" />
  <style>
    .jspsych-content {
      max-width: 98% !important;
      padding: 0 40px;
    }
    .jspsych-btn-group-grid {
      width: 98vw; justify-content: center;
    }
  </style>
</head>
<body></body>
<script>

  // initialize jsPsych
  var jsPsych = initJsPsych({
    on_finish: function () {
      //redirect to SONA
      window.location = "https://ucsd.sona-systems.com/webstudy_credit.aspx?experiment_id=3172&credit_token=31cbecdc27fd4b44abc3df1e96b767ab&survey_code="+id;
    },
    // send the data to DataPipe
    extensions: [
      {
        type: jsPsychExtensionPipe,
        params: {
          experiment_id: "mxFHTxfnA4hO",
          filename: function () {
            return subject_id + ".csv";
          }
        }
      }
    ]
  });

  // give each participant a random ID; their data file is named after it
  var subject_id = jsPsych.randomization.randomID(10);

  // get SONA ID
  var id = jsPsych.data.getURLVariable('id');

  // randomly assign participants to: 
  //   motivation: "support" or "reject"
  //   emphasis:    "US" or "Island" (which comparison set is the "supporting" one)
  // assign server-side and pass in the URL, e.g. index.html?motivation=reject&emphasis=Island
var params = new URLSearchParams(window.location.search);
  var motivation = params.get('motivation') ||
    jsPsych.randomization.sampleWithoutReplacement(['support', 'reject'], 1)[0];
  var emphasis = params.get('emphasis') ||
    jsPsych.randomization.sampleWithoutReplacement(['US', 'Island'], 1)[0];

  jsPsych.data.addProperties({
    subject_id: subject_id,
    motivation: motivation,
    emphasis: emphasis
  });

  // condition-dependent wording (to use in the vignettes/questions)
 var M = (motivation === 'support') ? {
    believe: 'believes',
    effective: 'effective',
    worked: 'worked',
    will_html: 'will',
    correct_belief: 'Believe that Policy A will work.',
    correct_recall: 'Believed that Policy A would work.'
  } : {
    believe: 'does not believe',
    effective: 'ineffective',
    worked: 'did not work',
    will_html: 'will <b>not</b>',
    correct_belief: 'Believe that Policy A will NOT work.',
    correct_recall: 'Believed that Policy A would NOT work.'
  };

  // stimuli
  var S = {
    map: (emphasis === 'US') ? 'USEmphasis-Map-Training.png' : 'IslandEmphasis-Map-Training.png',
    axes: 'Axes-Training.png',
    trends: 'Trends-Training.png',
    graph_check: 'Graph-Comprehension.png',
    A: 'A-HawaiiOnly.png',
    B: (emphasis === 'US') ? 'USCausal-B-Support.png' : 'IslandCausal-B-Support.png',
    C: (emphasis === 'US') ? 'USCausal-C-NotSupport.png' : 'IslandCausal-C-NotSupport.png',
    D: (emphasis === 'US') ? 'USCausal-D-AllCounterfactuals.png' : 'IslandCausal-D-AllCounterfactuals.png' 
  };
  var GRAPH_LABELS = { A: 'target_only', B: 'target_support', C: 'target_reject', D: 'target_all' };

  // ALL HELPER FUNCTIONS

  // image tag
  function img(file, width) {
    return '<img src="stimuli/' + file + '" style="max-width:' + width +
      'px; width:100%; height:auto; display:block; margin:12px auto;">';
  }

  // two arrays contain the same items
  function sameSet(a, b) {
    return a.length === b.length && a.every(function (x) { return b.indexOf(x) !== -1; });
  }

  // simple screen with one button
  function info(html, label) {
    return {
      type: jsPsychHtmlButtonResponse,
      stimulus: html,
      choices: [label || 'Continue'],
      data: { phase: 'info' }
    };
  }

  // multiple-choice / select-all question(s) on one page, followed by feedback
  // use opts.id/prompt/options/correct for a single question, or opts.items (array of {id, prompt, options, correct}) to put several single-choice questions on one page
  // opts.right / opts.wrong = feedback HTML shown after a correct / incorrect answer
    function quiz(opts) {
    var multi = opts.multi || false;
    var phase = opts.phase || 'training';
    var give_feedback = (opts.feedback === undefined) ? true : opts.feedback;
    var items = opts.items || [{ id: opts.id, prompt: opts.prompt, options: opts.options, correct: opts.correct }];

    function answer(item) {
      return (typeof item.correct === 'function') ? item.correct() : item.correct;
    }
    function text(x) {
      return (typeof x === 'function') ? x() : x;
    }

    var question = {
      type: multi ? jsPsychSurveyMultiSelect : jsPsychSurveyMultiChoice,
      preamble: (opts.image ? img(opts.image, 700) : '') + (opts.preamble || ''),
      questions: items.map(function (item) {
        return { prompt: item.prompt, name: item.id, options: (opts.shuffle === false) ? item.options : jsPsych.randomization.shuffle(item.options), required: true };
      }),
      data: { phase: phase, qid: opts.id },
      on_finish: function (data) {
        var all_correct = true;
        items.forEach(function (item) {
          var resp = data.response[item.id];
          var ok = multi ? sameSet(resp, answer(item)) : (resp === answer(item));
          if (items.length > 1) { data['correct_' + item.id] = ok; }
          if (!ok) { all_correct = false; }
        });
        data.correct_answer = JSON.stringify(items.map(answer));
        data.correct = all_correct;
      }
    };
    if (!give_feedback) { return [question]; }

    // feedback screen, shown after every question (different text if right vs. wrong)
    var feedback = {
      type: jsPsychHtmlButtonResponse,
      stimulus: function () {
        var was_correct = jsPsych.data.getLastTrialData().values()[0].correct;
        return '<div style="text-align: left;">' + text(was_correct ? opts.right : opts.wrong) + '</div>';
      },
      choices: ['Continue'],
      data: { phase: 'feedback', qid: opts.id }
    };
    return [question, feedback];
  }

  // open-ended question
  function text_question(id, prompt, preamble, rows) {
    return {
      type: jsPsychSurveyText,
      preamble: preamble || '',
      questions: [{ prompt: prompt, name: id, rows: rows || 6, columns: 80, required: true }],
      data: { phase: 'open_ended', qid: id }
    };
  }

  // create timeline
  var timeline = [];

 // preload images
  var preload = {
    type: jsPsychPreload,
    images: [
     'stimuli/IslandEmphasis-Map-Training.png', 'stimuli/USEmphasis-Map-Training.png', 'stimuli/Axes-Training.png', 'stimuli/Trends-Training.png', 'stimuli/Graph-Comprehension.png', 'stimuli/A-HawaiiOnly.png', 'stimuli/USCausal-B-Support.png', 'stimuli/USCausal-C-NotSupport.png', 'stimuli/USCausal-D-AllCounterfactuals.png', 'stimuli/IslandCausal-B-Support.png', 'stimuli/IslandCausal-C-NotSupport.png', 'stimuli/IslandCausal-D-AllCounterfactuals.png'
    ]
  };
  timeline.push(preload);

  // WELCOME MESSAGE + CONSENT
  var welcome = {
    type: jsPsychHtmlButtonResponse,
    stimulus: '<div style="text-align: left;">' +
      '<h2>Welcome!</h2>' +
      '<p>You are being invited to participate in a research study titled “Reproducibility of Psychological Science and Instruction.” This study is being done by Dr. Bria Long from UC San Diego and associated graduate students in Experimental Methods course. You were selected to participate in this study because you are an adult in the U.S. and have been a represented population in previous psychology studies. <br><br>' + 
      
      'The purpose of this study is to better understand how well previously published studies in the psychological field replicate online and with different populations. Your participation in this research should last approximately 5-30 minutes  If you agree to take part in this study, you may be asked to view a set of stimuli, including pictures, sounds, written text, or videos and then giving some responses via key-presses, verbally, or with paper-and-pencil. We may also observe your choices or preferences among an array of stimuli.  These stimuli will be taken directly from or closely adapted from studies that already exist in the published psychological literature. Stimuli will include, e.g., pictures of objects and human faces, audio and video clips, short text passages, etc. None of the stimuli will be disturbing, threatening, or offensive. The online and in-person experiments described in this protocol will take no more than 30 minutes. An example game you might play would be to click on an image on the screen that matches a word you hear being said out loud. Your total expected time commitment for this study is between 5-30 minutes, and is specified in the study description.<br><br>' +

      'Your participation in this study is completely voluntary and you can withdraw at any time. Choosing not to participate or withdrawing will result in no penalty or loss of benefits to which you are entitled. You are free to skip any question that you choose.<br><br>' +

      'We will not be asking for any personally identifying information, and we will handle responses as confidentially as possible. Your SONA or Prolific IDs will never be tied to your responses on this survey. However, we cannot guarantee the confidentiality of information transmitted over the Internet. To minimize this risk, data containing anything that might be personally identifiable (e.g. Prolific IDs or IP addresses) will be encrypted on transfer and storage and will only be accessible to qualified lab personnel. We will be keeping data collected as part of this experiment indefinitely. This anonymized data (containing neither Prolific IDs nor IP addresses) may be shared with the scientific community or with other participants to be used as stimuli in future studies.<br><br>' +

      'If you have questions about this project or if you have a research-related problem, you may contact the researcher(s),  Dr. Bria Long, brlong@ucsd.edu. If you have any questions concerning your rights as a research subject, you may contact the UC San Diego Office of IRB Administration at irb@ucsd.edu or 858-246-4777.<br><br>' +

      'By participating in this research you are indicating that you are at least 18 years old, have read this consent form, and agree to participate in this research study. Please keep this consent form for your records.</p>' + 
      '</div>',
    choices: ['I agree to participate in this research study.']
  };
  timeline.push(welcome);

 var intro = {
    type: jsPsychHtmlButtonResponse,
    stimulus: 
      '<p>In this study you will complete a short training, read a news story about a novel virus, ' +
      'and answer some questions about it. Please read carefully; you will receive feedback on the training questions.</p>',
    choices: ['Next']
  };
  timeline.push(intro);

// TRAINING MODULE 1: LOCATION (both U.S. states and islands)
  var REGIONS = ['Hawaii', 'Oregon', 'California', 'Hokkaido', 'Te Waipounamu'];
  
  timeline.push(info(
    '<h3>Location Training</h3>' +
    '<p>There are 5 regions in the scenario you will read about:</p>' +
    '<ol style="text-align: left;">'+
    '<li>Hawaii, United States</li><li>Oregon, United States</li><li>California, United States</li>' +
    '<li>Hokkaido, Japan</li><li>Te Waipounamu, New Zealand</li></ol>' +
    '<p>Below is a map that marks the locations of the 5 regions:</p>' + img(S.map, 800)
  ));

  timeline = timeline.concat(quiz({
    id: 'loc_train_us', multi: true, options: REGIONS, image: S.map,
    prompt: 'Some of these regions are <b>one of the 50 states of the United States</b>. ' +
      'Which regions are <b>one of the 50 states of the United States</b>? Mark <i>all</i> that apply:',
    correct: ['Hawaii', 'Oregon', 'California'],
    right: 'That is <b>correct</b>!<br><br>The regions that are <b>states in the United States</b> are: Hawaii, Oregon, and California.',
    wrong: '<b>Actually</b>, the regions that are <b>states in the United States</b> are: Hawaii, Oregon, and California.',
  }));
  timeline = timeline.concat(quiz({
    id: 'loc_train_island', multi: true, options: REGIONS, image: S.map,
    prompt: 'Here is the map again that marks the locations of the 5 regions. Some of these regions are <b>located on an island</b>. ' +
      'Which regions are <b>located on an island</b>? Mark <i>all</i> that apply:',
    correct: ['Hawaii', 'Hokkaido', 'Te Waipounamu'],
    right: 'That is <b>correct</b>!<br><br>The regions that are <b>islands</b> are: Hawaii, Hokkaido, and Te Waipounamu.',
    wrong: '<b>Actually</b>, the regions that are <b>islands</b> are: Hawaii, Hokkaido, and Te Waipounamu.'
  }));

 
// TRAINING MODULE 2: GRAPH COMPREHENSION
  timeline.push(info('<h3>Graph Training</h3><p>Next, you will learn how to read the line graphs used in this study.</p>'));

  // axes training
  timeline = timeline.concat(quiz({
    id: 'axes_x', image: S.axes, shuffle: false,
    preamble: '<p>Below are the axes of the graph you will reason about later. On the <b>x-axis</b> ' +
      '(horizontal line) is the number of days since the first novel virus cases.</p>',
    prompt: 'If Day 0 was December 31, what is the date of Day 5?',
    options: ['August 7', 'November 4', 'February 17', 'January 5'],
    correct: 'January 5',
    right: 'That is <b>correct</b>!<br><br>If Day 0 was December 31, then Day 5 is <b>January 5</b>.',
    wrong: '<b>Actually</b>, if Day 0 was December 31, then Day 5 is <b>January 5</b>.'
  }));

timeline = timeline.concat(quiz({
    id: 'axes_y', image: S.axes, shuffle: false,
    preamble: '<p>On the <b>y-axis</b> (vertical line) is the number of <i><b>new</b></i> virus cases on a given day. ' +
      'Much like the graphs of covid cases, <i>higher</i> numbers indicate a greater number of new cases, ' +
      'and <i>lower</i> numbers indicate a lower number of new cases.</p>',
    prompt: 'If Day 3 had a value of "200" and Day 4 had a value of "5000" this means that:',
    options: ['The number of new cases is <u>decreasing</u> over time',
      'The number of new cases is <u>staying</u> the same over time',
      'The number of new cases is <u>increasing</u> over time'],
    correct: 'The number of new cases is <u>increasing</u> over time',
    right: 'That is <b>correct</b>!<br><br>If Day 3 had a value of "200" and Day 4 had a value of "5000" this means that the number of new cases is <b>increasing</b> over time.',
    wrong: '<b>Actually</b>, if Day 3 had a value of "200" and Day 4 had a value of "5000" this means that the number of new cases is <b>increasing</b> over time.'
  }));

  // purple vs orange line training
  var data_pre = '<p>On this graph, each <b>line</b> will represent a specific region.</p>';
  var city_options = ['The number of new virus cases in City A.', 'The number of new virus cases in City B.',
    'The number of new virus cases in City C.', 'The number of new virus cases in City D.'];
  timeline = timeline.concat(quiz({
    id: 'data_lines', image: S.trends, preamble: data_pre, shuffle: false,
    items: [
      { id: 'data_purple', prompt: 'What does the <b>purple line</b> represent?', options: city_options, correct: city_options[0] },
      { id: 'data_orange', prompt: 'What does the <b>orange line</b> represent?', options: city_options, correct: city_options[1] }
    ],
    right: 'That is <b>correct</b>!<br><br>The <b>purple line</b> represents City A\u2019s novel virus cases and the <b>orange line</b> represents City B\u2019s novel virus cases.',
    wrong: '<b>Actually</b>, the <b>purple line</b> represents City A\u2019s novel virus cases and the <b>orange line</b> represents City B\u2019s novel virus cases.'
  }));

  // solid vs dashed line training
 var policy_pre = '<p>If the line is <b>solid (&mdash;)</b>, the region <i><b>has not yet</b></i> implemented any policy ' +
    'to address the virus. If the line is <b>dashed (- - -)</b>, the region <i><b>has</b></i> implemented a policy to address the virus.</p>';
  var day_options = ['Day 0', 'Day 2', 'Day 5', 'Never'];
  timeline = timeline.concat(quiz({
    id: 'policy_lines', image: S.trends, preamble: policy_pre, shuffle: false,
    items: [
      { id: 'policy_A', prompt: 'Which day did City A implement a policy to address the virus?', options: day_options, correct: 'Day 5' },
      { id: 'policy_B', prompt: 'Which day did City B implement a policy to address the virus?', options: day_options, correct: 'Never' }
    ],
    right: 'That is <b>correct</b>!<br><br><b>City A</b> implemented a policy on <b>Day 5</b>, and <b>City B never</b> implemented a policy.',
    wrong: '<b>Actually</b>, <b>City A</b> implemented a policy on <b>Day 5</b>, and <b>City B never</b> implemented a policy.'
  }));


  // trends training
   var trend_options = ['Decreased over time', 'Stayed the same over time', 'Increased over time'];
  timeline = timeline.concat(quiz({
    id: 'trend_lines', image: S.trends, shuffle: false,
    items: [
      { id: 'trend_A', prompt: 'In City A, the number of new virus cases generally:', options: trend_options, correct: 'Stayed the same over time' },
      { id: 'trend_B', prompt: 'In City B, the number of new virus cases generally:', options: trend_options, correct: 'Increased over time' }
    ],
    right: 'That is <b>correct</b>!<br><br><b>City A\u2019s</b> cases <b>stayed the same</b> over time, and <b>City B\u2019s</b> cases <b>increased</b> over time.',
    wrong: '<b>Actually</b>, <b>City A\u2019s</b> cases <b>stayed the same</b> over time, and <b>City B\u2019s</b> cases <b>increased</b> over time.'
  }));


  // NEWS STORY + ATTENTION CHECK (with corrective feedback)
  timeline.push(info(
    '<p><b>Now, please read the news story below:</b></p>' +
    '<div style="text-align:left; max-width:800px; margin:0 auto;">' +
    '<p>November 2024 &mdash; In five regions of the world (Hawaii, United States; Hokkaido, Japan; ' +
    'Te Waipounamu, New Zealand; Oregon, United States; California, United States), there was a novel virus ' +
    'that began to spread. <br><br> Leaders of the regions were unsure about what to do because this was a novel virus ' +
    'that had never been seen before. But, together, the leaders decided on a set of public policies, called Policy A. <br><br>' +
    'Hawaiian leaders chose to implement Policy A on Day 5 to see if it would reduce infections. ' +
    'The other four regions did not implement Policy A, waiting to see whether it worked in Hawaii.</p>'+'</div>'
  ));

  timeline = timeline.concat(quiz({
    id: 'story_check_only_region', phase: 'attention',
    prompt: 'According to the story you just read, which was the only region to implement Policy A?',
    options: ['Hawaii, United States', 'Te Waipounamu, New Zealand', 'Oregon, United States', 'All 5 regions'],
    correct: 'Hawaii, United States',
    right: 'That is <b>correct</b>! Hawaii implemented Policy A.',
    wrong: '<b>Actually</b>, Hawaii implemented Policy A.'
  }));

  // MOTIVATED REASONING MANIPULATION
  timeline.push(info(
    '<p>Imagine that you are a politician who <b>really</b> ' + M.believe + ' that Policy A will work to ' +
    'reduce the spread of the virus. You have done a lot of research, and you strongly believe that ' +
    'Policy A will be <b>' + M.effective + '</b>.</p>'
  ));

  // manipulation check
 timeline = timeline.concat(quiz({
    id: 'motivation_passage_check', phase: 'attention',
    prompt: 'According to the passage above, you as a politician:',
    options: ['Believe that Policy A will work.', 'Believe that Policy A will NOT work.',
      'Are not sure whether Policy A will work or not.'],
    correct: function () { return M.correct_belief; },
    right: function () { return 'That is <b>correct</b>! As a politician, you believe that Policy A <b>' + M.will_html + '</b> work.'; },
    wrong: function () { return '<b>Actually</b>, as a politician, you believe that Policy A <b>' + M.will_html + '</b> work.'; }
  }));

  // data description
  timeline.push(text_question(
  'data_description',
  '<p>Now imagine that you received data from all 5 regions:</p>' +
  'Describe in 3 to 5 sentences the data that you see. Remember, Hawaii was the <b>only</b> location to ' +
  'implement Policy A. All other locations did <b>not</b> implement Policy A.' + img(S.D, 850)
));

  // DV: DATA SELECTION
  var chosen = null; // letter of the graph the participant picks

  var graph_selection = {
    type: jsPsychHtmlButtonResponse,
    stimulus: '<p>While this is all the data, <b>you</b> get to decide <i><b>which</i></b> data is shown on the nightly news.</p>' +
      '<p>Remember you are a politician who <b>really</b> ' + M.believe + ' in Policy A. ' +
      'Which of the following graphs would you show on the nightly news to show that it <b>' + M.worked + '</b>?</p>',
    choices: ['A', 'B', 'C', 'D'],
    button_layout: 'grid',
    grid_columns: 2,
    button_html: function (choice) {
      return '<button class="jspsych-btn" style="background:#fff; border:2px solid #999; padding:10px; margin:8px; ' +
        'width:46vw; max-width:900px; cursor:pointer;">' +
        '<div style="font-size:20px; margin-bottom:6px;"><b>(' + choice + ')</b></div>' +
        '<img src="stimuli/' + S[choice] + '" style="width:100%; height:auto; display:block;">' +
        '</button>';
    },
    data: { phase: 'DV', qid: 'graph_selection' },
    on_finish: function (data) {
      var letter = ['A', 'B', 'C', 'D'][data.response];
      chosen = letter;
      data.choice_letter = letter;
      data.choice_label = GRAPH_LABELS[letter];
      data.choice_image = S[letter];
    }
  };
  timeline.push(graph_selection);

  // open-ended justification
  timeline.push(text_question(
    'convince_audience',
    'Now imagine that you as the politician are describing the graph you selected to the nightly news audience. ' +
    'What would you say to convince your audience that Policy A <b>' + M.worked + '</b>? ' +
    'Please write 2 to 3 sentences.',
    '', 5
  ));

  // justify choice (new page showing chosen graph)
  var justify = text_question(
    'justify_choice',
    'Imagine that someone saw <b>all</b> of the data for <b>all</b> 5 cities, and asked you to explain why you chose ' +
    'to show <i><b>this</b></i> particular graph. What would you say to justify your decision? Please write 2 to 3 sentences.',
    '', 5
  );
  // preamble is a function so it is evaluated after the participant has chosen a graph
  justify.preamble = function () {
    return '<p><b>Your chosen graph:</b></p>' + img(S[chosen], 800);
  };
  timeline.push(justify);

  // COMPREHENSION / MANIPULATION CHECKS (no feedback)
  timeline.push(info('<p>In these final few questions, you will share what you remember from the story you just heard about.</p>'));

    timeline = timeline.concat(quiz({
      id: 'chk_intervention', phase: 'check', feedback: false,
      prompt: 'Which of the following happened in Hawaii?',
      options: ['Hawaii implemented Policy A ten days after all other regions did.',
        'Hawaii was the only region with the Novel Virus.',
        'Hawaii was the only region <b>without</b> the Novel Virus.',
        'Hawaii was the only region to implement Policy A.'],
      correct: 'Hawaii was the only region to implement Policy A.'
    }));
    timeline = timeline.concat(quiz({
    id: 'chk_motivation', phase: 'check', feedback: false,
    prompt: 'As a memory check, you as a politician:',
    options: ['Believed that Policy A would work.', 'Believed that Policy A would NOT work.',
      'Were not sure whether Policy A would work or not.'],
    correct: function () { return M.correct_recall; }
  }));
  timeline = timeline.concat(quiz({
    id: 'chk_graph', phase: 'check', feedback: false, image: S.graph_check,
    preamble: '<p>Based on the graph below, mark the <b>true</b> statement.</p>',
    prompt: 'Which statement is true?',
    options: ['All three regions implemented Policy A.',
      'New Mexico\u2019s cases decreased over time.',
      'Massachusetts implemented Policy A on Day 5.',
      'Pennsylvania implemented Policy A on Day 5.'],
    correct: 'Massachusetts implemented Policy A on Day 5.'
  }));
  timeline = timeline.concat(quiz({
    id: 'chk_location_us', phase: 'check', feedback: false, multi: true, options: REGIONS,
    prompt: 'Which regions are <b>not</b> states in the United States? Check all that apply.',
    correct: ['Hokkaido', 'Te Waipounamu']
  }));
  timeline = timeline.concat(quiz({
    id: 'chk_location_island', phase: 'check', feedback: false, multi: true, options: REGIONS,
    prompt: 'Which regions are mainland regions (i.e., they are <b>not</b> an island)? Check all that apply.',
    correct: ['California', 'Oregon']
  }));

// GENERAL BELIEFS + DEMOGRAPHICS
  var mandates_slider = {
    type: jsPsychHtmlSliderResponse,
    stimulus: '<p>Please report your agreement with the following statement:</p>' +
      '<p><b>"Public mandates (e.g., requiring people to wear masks and social distance) are effective ' +
      'in reducing the number of new virus cases in a society."</b></p>',
    min: 0,
    max: 100,
    slider_start: 50,
    require_movement: true,
    labels: ['0<br>Definitely disagree', '50', '100<br>Definitely agree'],
    data: { phase: 'beliefs', qid: 'mandates_effective' }
  };
  timeline.push(mandates_slider);

  timeline.push(text_question('mandates_why', 'Why do you think that?', '', 4));

  // age, gender, race (open text)
  var demographics_text = {
    type: jsPsychSurveyText,
    preamble: '<p><b>This last part will ask you some basic demographic information.</b></p>',
    questions: [
      { prompt: 'What is your age (in years)?', name: 'age', rows: 1, columns: 20, required: false },
      { prompt: 'What gender do you identify as?', name: 'gender', rows: 1, columns: 40, required: false },
      { prompt: 'What race(s) do you identify as?', name: 'race', rows: 1, columns: 40, required: false }
    ],
    data: { phase: 'demographics', qid: 'age_gender_race' },
    on_finish: function (data) {
      data.age = data.response.age;
      data.gender = data.response.gender;
      data.race = data.response.race;
    }
  };
  timeline.push(demographics_text);

  // education
  var education = {
    type: jsPsychSurveyMultiChoice,
    questions: [{
      prompt: 'What is your highest level of education?',
      name: 'education',
      required: true,
      options: [
        'Less than a high school diploma',
        'High school diploma',
        "Associate's degree",
        "Bachelor's degree (B.A., B.S.)",
        "Master's degree (M.A., M.S.)",
        'Professional degree (M.D., Ph.D., etc.)',
        'Prefer to self-describe:'
      ]
    }],
    data: { phase: 'demographics', qid: 'education' }
  };
  timeline.push(education);

  // education: self-describe text box only shown if "Prefer to self-describe:" was chosen
  var education_self_describe = {
    timeline: [{
      type: jsPsychSurveyText,
      questions: [{ prompt: 'Prefer to self-describe:', name: 'education_self_describe', rows: 1, columns: 40, required: true }],
      data: { phase: 'demographics', qid: 'education_self_describe' }
    }],
    conditional_function: function () {
      var last = jsPsych.data.getLastTrialData().values()[0];
      return last.response.education === 'Prefer to self-describe:';
    }
  };
  timeline.push(education_self_describe);

  // political orientation
  var political = {
    type: jsPsychSurveyMultiChoice,
    questions: [{
      prompt: 'What is your political orientation?',
      name: 'political',
      required: true,
      options: [
        'Extremely Liberal',
        'Liberal',
        'Slightly Liberal',
        'Moderate/Middle of the Road',
        'Slightly Conservative',
        'Conservative',
        'Extremely Conservative',
        "Haven't thought about it much"
      ]
    }],
    data: { phase: 'demographics', qid: 'political' }
  };
  timeline.push(political);

  // household income
  var income = {
    type: jsPsychSurveyText,
    questions: [{
      prompt: 'What is the gross income of your household (to the nearest 1000; please write a <b>number</b> without the dollar sign or commas)?',
      name: 'income', rows: 1, columns: 20, required: true
    }],
    data: { phase: 'demographics', qid: 'income' },
    on_load: function () {
      var box = document.querySelector('#input-0');
      box.setAttribute('inputmode', 'numeric');
      }
  };
  timeline.push(income);

  var debrief = {
  type: jsPsychHtmlButtonResponse,
  stimulus:
    '<div class="page-pad" style="text-align:left;">' +
    '<h2>Thank you!</h2>' +
    '<p>This study is a replication of a study from Amemiya, Heyman, and Walker (2024) exploring how people come to ' +
    'opposite causal judgments about a societal intervention even when they agree about the events that actually ' +
    'happened because they are prompted to consider different counterfactual outcomes via specific comparison cases.</p>' +
    '<p>When you click the button below, your responses will be saved and you will be returned to SONA to receive credit.</p>' +
    '</div>',
  choices: ['Finish and return to SONA'],
  data: { phase: 'debrief' }
};
timeline.push(debrief);

  // start the experiment
  jsPsych.run(timeline);

</script>
